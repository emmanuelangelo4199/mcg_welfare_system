{% if messages %}
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  {% for message in messages %}
  <div class="pointer-events-auto flex items-center p-4 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 {% if message.tags == 'error' %}bg-red-50 text-red-800 border-red-200{% elif message.tags == 'success' %}bg-green-50 text-green-800 border-green-200{% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border-amber-200{% else %}bg-blue-50 text-blue-800 border-blue-200{% endif %}">
    <div class="flex-1">
      <div class="font-bold capitalize mb-0.5">
        {% if message.tags == 'error' %}Error{% elif message.tags == 'success' %}Success{% elif message.tags == 'warning' %}Notice{% else %}Info{% endif %}
      </div>
      <div>{{ message }}</div>
    </div>
    <button type="button" onclick="this.parentElement.remove()" class="ml-4 text-current opacity-70 hover:opacity-100">
      <span class="material-symbols-outlined text-sm">close</span>
    </button>
  </div>
  {% endfor %}
</div>

<script>
  setTimeout(() => {
    const container = document.getElementById('toast-container');
    if (container) {
      container.style.opacity = '0';
      setTimeout(() => container.remove(), 300);
    }
  }, 5000);
</script>
{% endif %}
